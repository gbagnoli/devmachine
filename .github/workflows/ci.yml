name: CI

on:
  workflow_call:
    inputs:
      full-skillet:
        type: boolean
        default: false
        description: Run every Skillet check regardless of changed paths
  push:
    branches: [ main, master, skillet ]
  pull_request:
    branches: [ main, master, skillet ]

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate workflows and embedded shell
        uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        with:
          args: -color

  chef-lint:
    # Ruby 3.1 has no prebuilt binaries for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - name: Install Cookstyle
        run: gem install cookstyle
      - name: Run Cookstyle
        run: cookstyle site-cookbooks roles

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Run Ruff Check
        run: uv run ruff check --diff . ublue/skillet/tools ublue/skillet/integration_tests/quantum-trial-guest.py
      - name: Run Ruff Format
        run: uv run ruff format --diff . ublue/skillet/tools ublue/skillet/integration_tests/quantum-trial-guest.py
      - name: Test release metadata validation
        run: uv run python -m unittest discover -s ublue/skillet/tools/tests -p "test_*.py"
      - name: Run Mypy
        run: uv run mypy --ignore-missing-imports site-cookbooks fabfile.py ublue/skillet/crates/homeassistant ublue/skillet/tools
      - name: Test Home Assistant missing-only bootstrap
        run: uv run python -m unittest discover -s ublue/skillet/crates/homeassistant/tests -p "test_*.py"

  cargo-release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the pinned release tool for the runner
        run: |
          version=$(cat ublue/skillet/tools/cargo-release-version)
          cargo install --locked --version "$version" --target x86_64-unknown-linux-gnu \
            --root "$RUNNER_TEMP/release-tools" cargo-release
          echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
      - name: Exercise dry-run, patch and prerelease in disposable repositories
        run: python3 ublue/skillet/tools/tests/cargo_release_acceptance.py

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          find . -type f \
            \( -name '*.sh' -o -name run -o -name butane -o -name flatpak-virt \
               -o -name test-vm -o -name test-vm-ready -o -name virsh -o -name virt-install \
               -o -name install-hardware \
               -o -name setup-llama-server -o -name update-llama \) \
            -not -path './.git/*' -not -path './.venv/*' -not -path './berks-cookbooks/*' \
            -not -path '*/target/*' -not -path './ublue/llama/files/update-llama' \
            -exec shellcheck -x {} +
          # This desktop helper intentionally ignores a failed best-effort stop.
          shellcheck -x --exclude=SC2015 ublue/llama/files/update-llama

  skillet-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: ${{ !inputs.full-skillet }}
        id: filter
        with:
          filters: |
            rust:
              - 'ublue/skillet/**'
              - 'ublue/butane/**'
              - 'ublue/AGENTS.md'
              - '.github/workflows/ci.yml'
              - '.github/workflows/skillet-release.yml'
      
      - name: Set up Rust
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        timeout-minutes: 10
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install --yes musl-tools

      - name: Rust Cache
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ublue/skillet

      - name: Run Clippy
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step run-clippy

      - name: Check formatting
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step check-formatting

      - name: Run Unit Tests
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step run-unit-tests

      - name: Run Integration Tests
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step run-integration-tests

      - name: Validate private UI Caddy configuration
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step validate-private-ui-caddy-configuration

      - name: Build and test the pinned Jellyfin cache image
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step build-and-test-the-pinned-jellyfin-cache-image

      - name: Test Gokapi native bootstrap and paired state without external credentials
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step test-gokapi-native-bootstrap-and-paired-state-without-external-credentials

      - name: Test Pi-hole proxy authentication without external credentials
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step test-pi-hole-proxy-authentication-without-external-credentials

      - name: Test Syncthing bootstrap without external credentials
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step test-syncthing-bootstrap-without-external-credentials

      - name: Test FileBrowser Quantum file operations without external credentials
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step test-filebrowser-quantum-file-operations-without-external-credentials

      - name: Test native UPS configuration without hardware
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step test-native-ups-configuration-without-hardware

      - name: Run installation and bootstrap regressions
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step run-installation-and-bootstrap-regressions

      - name: Test TPM bootstrap without hardware or external credentials
        if: inputs.full-skillet || steps.filter.outputs.rust == 'true'
        run: python3 ublue/skillet/tools/ci_checks.py --step test-tpm-bootstrap-without-hardware-or-external-credentials
