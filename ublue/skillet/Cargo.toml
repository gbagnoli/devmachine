[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/kexec",
    "crates/hardening",
    "crates/pihole",
    "crates/unifi",
    "crates/homeassistant",
    "crates/syncthing",
    "crates/filebrowser",
    "crates/nut",
    "crates/btrbk",
    "crates/caddy",
    "crates/homer",
    "crates/ddns",
    "crates/datadog",
    "crates/smtp",
    "crates/network",
    "crates/podman",
    "crates/postgres",
    "crates/joplin",
    "crates/jellyfin",
    "crates/plex",
    "crates/gokapi",
    "crates/airtrail",
    "crates/media",
    "crates/cli",
    "crates/hosts/joey",
    "crates/hosts/donbot",
    "crates/hosts/clamps",
    "crates/cli-common",
    "crates/test-fixture",
    "crates/vm",
    "crates/host-profiles",
    "crates/workstation",
    "crates/sudo-askpass",
]

[workspace.package]
version = "0.1.2"

[workspace.dependencies]
osc8 = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }
supports-hyperlinks = "3.2"
skillet_kexec = { path = "crates/kexec" }
skillet_core = { path = "crates/core" }
skillet_hardening = { path = "crates/hardening" }
skillet_pihole = { path = "crates/pihole" }
skillet_homeassistant = { path = "crates/homeassistant" }
skillet_unifi = { path = "crates/unifi" }
skillet_nut = { path = "crates/nut" }
skillet_filebrowser = { path = "crates/filebrowser" }
skillet_syncthing = { path = "crates/syncthing" }
skillet_btrbk = { path = "crates/btrbk" }
skillet_caddy = { path = "crates/caddy" }
skillet_homer = { path = "crates/homer" }
skillet_ddns = { path = "crates/ddns" }
skillet_datadog = { path = "crates/datadog" }
skillet_smtp = { path = "crates/smtp" }
skillet_network = { path = "crates/network" }
skillet_podman = { path = "crates/podman" }
skillet_postgres = { path = "crates/postgres" }
skillet_joplin = { path = "crates/joplin" }
skillet_jellyfin = { path = "crates/jellyfin" }
skillet_plex = { path = "crates/plex" }
skillet_gokapi = { path = "crates/gokapi" }
skillet_airtrail = { path = "crates/airtrail" }
skillet_media = { path = "crates/media" }
skillet_cli_common = { path = "crates/cli-common" }
skillet_vm = { path = "crates/vm" }
skillet_hosts = { path = "crates/host-profiles" }
skillet_workstation = { path = "crates/workstation" }
url = "2"
thiserror = "1.0"
sha2 = "0.10"
uzers = "0.12.2"
nix = { version = "0.29", features = ["user", "fs"] }
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10.7"
hex = "0.4"
zbus = { version = "5.19", features = ["blocking-api"] }
askama = "0.16.1"
keepass = { version = "0.13.25", features = ["save_kdbx4"] }
rpassword = "7.5"
cloudflare = { version = "0.14.0", default-features = false, features = ["blocking", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyutils = "0.4"
uuid = { version = "1.26", features = ["serde", "v4"] }
quick-xml = { version = "0.41", features = ["serialize"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Optional: explicitly allow some pedantic lints if they are too noisy
