name: Caddy service image

on:
  push:
    branches: [main, master, skillet]
    paths:
      - 'ublue/skillet/crates/caddy/image/**'
      - '.github/workflows/caddy-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ublue/skillet/crates/caddy/image
          file: ublue/skillet/crates/caddy/image/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/skillet-caddy:cache-v1
            ghcr.io/${{ github.repository_owner }}/skillet-caddy:${{ github.sha }}
