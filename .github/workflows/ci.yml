name: CI

on:
  push:
    branches: [ main, master, skillet ]
  pull_request:
    branches: [ main, master, skillet ]

jobs:
  chef-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - name: Install Cookstyle
        run: gem install cookstyle
      - name: Run Cookstyle
        run: cookstyle site-cookbooks roles

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Run Ruff Check
        run: uv run ruff check --diff .
      - name: Run Ruff Format
        run: uv run ruff format --diff .
      - name: Run Mypy
        run: uv run mypy --ignore-missing-imports site-cookbooks fabfile.py

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          find . -type f \
            \( -name '*.sh' -o -name run -o -name butane -o -name flatpak-virt \
               -o -name test-vm -o -name test-vm-ready -o -name virsh -o -name virt-install \
               -o -name setup-llama-server -o -name update-llama \) \
            -not -path './.git/*' -not -path './.venv/*' -not -path './berks-cookbooks/*' \
            -not -path '*/target/*' -exec shellcheck -x {} +

  skillet-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'ublue/skillet/**'
              - 'ublue/butane/**'
              - 'ublue/AGENTS.md'
              - '.github/workflows/ci.yml'
      
      - name: Set up Rust
        if: steps.filter.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Rust Cache
        if: steps.filter.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ublue/skillet

      - name: Run Clippy
        if: steps.filter.outputs.rust == 'true'
        run: cd ublue/skillet && cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        if: steps.filter.outputs.rust == 'true'
        run: cd ublue/skillet && cargo fmt --all -- --check

      - name: Run Unit Tests
        if: steps.filter.outputs.rust == 'true'
        run: cd ublue/skillet && cargo test --workspace --all-targets

      - name: Run Integration Tests
        if: steps.filter.outputs.rust == 'true'
        run: |
          cd ublue/skillet
          cargo run --bin skillet -- test run beezelbot --phase base --image fedora:latest
