name: Skillet release

on:
  push:
    tags: ['skillet-v*']

permissions:
  contents: read

concurrency:
  group: skillet-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: Validate source release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve annotated tags: checkout by tag can refetch the peeled SHA
          # directly into refs/tags and replace the local annotation object.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate annotated tag and shared version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 ublue/skillet/tools/release.py --tag "$RELEASE_TAG"

  checks:
    needs: identity
    uses: ./.github/workflows/ci.yml
    with:
      full-skillet: true

  build:
    name: Validate release binaries and image bundles
    needs: checks
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/ublue/skillet/target
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve annotated tags: checkout by tag can refetch the peeled SHA
          # directly into refs/tags and replace the local annotation object.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install CI musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ublue/skillet
      - name: Build matching release binaries
        working-directory: ublue/skillet
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --workspace --bins
      - name: Verify source and binary identity
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 ublue/skillet/tools/release.py --tag "$RELEASE_TAG" \
            --binary-dir "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release" \
            --write-lock "$RUNNER_TEMP/skillet-release.json" --github-output "$GITHUB_OUTPUT"
      - name: Render and verify every host bundle
        working-directory: ublue/skillet
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          binary_dir="$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release"
          for crate in crates/hosts/*; do
            host=${crate##*/}
            tree="$RUNNER_TEMP/skillet-$host"
            "$binary_dir/skillet" image "$host" --source-revision "$RELEASE_COMMIT" \
              --generic-binary "$binary_dir/skillet" --host-binary "$binary_dir/skillet-$host" --output "$tree"
            "$tree/usr/bin/skillet" image "$host" --source-revision "$RELEASE_COMMIT" \
              --generic-binary "$tree/usr/bin/skillet" --host-binary "$tree/usr/bin/skillet-$host" --output "$tree"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: skillet-release-identity
          path: ${{ runner.temp }}/skillet-release.json
          if-no-files-found: error

  publish:
    name: Publish source release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: skillet-release-identity
          path: ${{ runner.temp }}/release-identity
      - name: Recheck the tag and tested commit before publication
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          python3 ublue/skillet/tools/release.py --tag "$RELEASE_TAG" \
            --lock-file "$RUNNER_TEMP/release-identity/skillet-release.json"
      - name: Create release without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Skillet $RELEASE_VERSION")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh "${args[@]}"

  propose-image-update:
    name: Propose ucore-images dependency update
    needs: [build, publish]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Require cross-repository credentials
        env:
          PR_TOKEN: ${{ secrets.UCORE_IMAGES_PR_TOKEN }}
        run: |
          if [[ -z "$PR_TOKEN" ]]; then
            echo "::error::Set UCORE_IMAGES_PR_TOKEN with Contents and Pull requests write access to ucore-images; see the Skillet release guide."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ucore-images
          ref: main
          path: images
          token: ${{ secrets.UCORE_IMAGES_PR_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: skillet-release-identity
          path: ${{ runner.temp }}/release-identity
      - name: Validate publication and generate dependency lock
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$RELEASE_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/skillet-publication.json"
          python3 source/ublue/skillet/tools/release.py --tag "$RELEASE_TAG" \
            --lock-file "$RUNNER_TEMP/release-identity/skillet-release.json" \
            --release-json "$RUNNER_TEMP/skillet-publication.json" \
            --write-lock "$GITHUB_WORKSPACE/images/skillet-release.json"
      - name: Create or update dependency pull request
        id: proposal
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.UCORE_IMAGES_PR_TOKEN }}
          path: images
          base: main
          branch: automation/${{ needs.build.outputs.tag }}
          add-paths: skillet-release.json
          commit-message: 'build: update Skillet to ${{ needs.build.outputs.version }}'
          title: 'build: update Skillet to ${{ needs.build.outputs.version }}'
          body: |
            Update the Skillet dependency to the published [${{ needs.build.outputs.tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ needs.build.outputs.tag }}).

            Source commit: `${{ needs.build.outputs.commit }}`.

            The release passed full CI, binary provenance and image-bundle validation. GitHub auto-merges this PR after the required image CI checks pass; image CI builds and signs the host images from this exact commit.
      - name: Enable auto-merge after required image checks
        if: steps.proposal.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.UCORE_IMAGES_PR_TOKEN }}
          PR_URL: ${{ steps.proposal.outputs.pull-request-url }}
        run: gh pr merge "$PR_URL" --auto --squash --repo "${{ github.repository_owner }}/ucore-images"
      - name: Report proposal
        env:
          PR_URL: ${{ steps.proposal.outputs.pull-request-url }}
        run: |
          if [[ -n "$PR_URL" ]]; then
            echo "Dependency pull request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No dependency change requires a pull request." >> "$GITHUB_STEP_SUMMARY"
          fi
