name: Switch collector image

on:
  push:
    branches: [main, master]
    paths:
      - 'ublue/skillet/crates/datadog/switch-collector/**'
      - '.github/workflows/switch-collector-image.yml'
  pull_request:
    paths:
      - 'ublue/skillet/crates/datadog/switch-collector/**'
      - '.github/workflows/switch-collector-image.yml'
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switch-collector-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test collector
        run: python -m unittest discover -s ublue/skillet/crates/datadog/switch-collector -v
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build collector and publish from default branch
        uses: docker/build-push-action@v6
        with:
          context: ublue/skillet/crates/datadog/switch-collector
          file: ublue/skillet/crates/datadog/switch-collector/Containerfile
          pull: true
          no-cache: true
          push: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/skillet-switch-collector:v1
            ghcr.io/${{ github.repository_owner }}/skillet-switch-collector:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
